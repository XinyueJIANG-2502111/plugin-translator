<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 220px; padding: 15px; font-family: sans-serif; margin: 0; background: #fff; }
        .container { display: flex; flex-direction: column; gap: 14px; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .label { font-size: 14px; color: #333; font-weight: bold; }
        .language-select { display: block; width: 100%; margin-top: 6px; padding: 7px 8px; border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #222; font-size: 13px; }
        /* Keep the native checkbox accessible while rendering a custom switch. */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #007acc; }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <span class="label">Hover translation</span>
            <label class="switch">
                <input type="checkbox" id="pluginToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div>
            <label class="label" for="sourceLanguage">Translate</label>
            <select class="language-select" id="sourceLanguage">
                <option value="auto">Auto</option>
                <option value="en">English</option>
            </select>
        </div>
        <div>
            <label class="label" for="targetLanguage">To</label>
            <select class="language-select" id="targetLanguage">
                <option value="zh-CN">Simplified Chinese</option>
                <option value="zh-TW">Traditional Chinese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
            </select>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
