<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 180px; padding: 15px; font-family: sans-serif; margin: 0; background: #fff; }
        .container { display: flex; justify-content: space-between; align-items: center; }
        .label { font-size: 14px; color: #333; font-weight: bold; }
        /* Switch Container / 开关外壳 */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        /* Slider / 滑块样式 */
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #007acc; }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>
    <div class="container">
        <span class="label">悬停翻译功能</span>
        <label class="switch">
            <input type="checkbox" id="pluginToggle" checked>
            <span class="slider"></span>
        </label>
    </div>
    <script src="popup.js"></script>
</body>
</html>
